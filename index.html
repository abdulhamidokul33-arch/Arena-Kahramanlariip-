rapper/gradle-wrapper.properties\\ndistributionBase=GRADLE_USER_HOME\\ndistributionPath=wrapper/dists\\ndistributionUrl=https\\\\://services.gradle.org/distributions/gradle-9.6.0-bin.zip\\nzipStoreBase=GRADLE_USER_HOME\\nzipStorePath=wrapper/dists\\n--- README_TR.md\\n# Arena Kahramanları — Android proje paketi\\n\\nBu proje, oyunun HTML sürümünü Android uygulaması içine gömer. Oyun dosyası uygulamanın içindedir; kurulumdan sonra internet bağlantısı gerekmez. Oyun yatay ekranda açılır ve ekrandaki dokunmatik kontrolleri kullanır.\\n\\n## 1. APK oluşturma (Windows)\\n\\n1. Bilgisayarına Android Studio'yu resmi sayfadan kur: https://developer.android.com/studio\\n2. Bu ZIP dosyasını bir klasöre çıkar. Örnek: `C:\\\\Games\\\\ArenaKahramanlariAndroid`\\n3. Android Studio'yu aç ve **Open** ile `ArenaKahramanlariAndroid` klasörünü seç.\\n4. İlk senkronizasyonda internet bağlantısı açık olsun. Gradle ve Android eklentileri indirilecektir.\\n5. SDK Manager'da **Android SDK Platform 36** ve **Android SDK Build-Tools 36.0.0** kurulu olsun. Android Gradle Plugin 9.4, JDK 17 gerektirir; Android Studio'nun gömülü JDK'sını kullanabilirsin.\\n6. Android Studio menüsünden **Build \u003e Build Bundle(s) / APK(s) \u003e Build APK(s)** seç.\\n7. Derleme başarılı olunca APK şu konumda olur:\\n   `app\\\\build\\\\outputs\\\\apk\\\\debug\\\\app-debug.apk`\\n\\nAlternatif olarak proje klasöründeki `build-apk.bat` dosyasını çalıştırabilirsin. Bu yol da ilk kullanımda Gradle'ı indirmek için internet ister.\\n\\n## 2. APK'yı Android telefona yükleme\\n\\n1. `app-debug.apk` dosyasını USB kablosu, Google Drive veya başka bir dosya aktarım yöntemiyle telefona gönder.\\n2. Telefonda APK dosyasına dokun.\\n3. Android izin isterse yalnızca dosyayı açtığın uygulama için **Bilinmeyen uygulamaları yükle / Bu kaynaktan izin ver** seçeneğini etkinleştir.\\n4. **Yükle**'ye bas ve oyunu aç. Oyun yatay ekran modunda başlar.\\n\\n## Önemli notlar\\n\\n- Bu, test için imzalanmış bir **debug APK** üretir. Google Play yayını için ayrıca imzalı bir **Android App Bundle (AAB)** oluşturmak ve Play Console adımlarını tamamlamak gerekir.\\n- Reklam SDK'sı ve gerçek çevrim içi çok oyunculu sistem bu pakete dahil değildir. Oyun, mevcut haliyle çevrim dışı botlu sürümdür.\\n- İlk Android derlemesi; Gradle, Android Gradle Plugin ve Android SDK paketleri için internet bağlantısı ister. Oluşan APK ise oyun dosyalarını kendi içinde taşır.\\n--- app/src/main/AndroidManifest.xml\\n\u003c?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?\u003e\\n\u003cmanifest xmlns:android=\\\"http://schemas.android.com/apk/res/android\\\"\u003e\\n    \u003capplication\\n        android:allowBackup=\\\"false\\\"\\n        android:icon=\\\"@drawable/ic_launcher\\\"\\n        android:label=\\\"Arena Kahramanları\\\"\\n        android:supportsRtl=\\\"true\\\"\\n        android:theme=\\\"@android:style/Theme.Material.Light.NoActionBar\\\"\\n        android:usesCleartextTraffic=\\\"false\\\"\u003e\\n        \u003cactivity\\n            android:name=\\\".MainActivity\\\"\\n            android:configChanges=\\\"orientation|screenSize|keyboardHidden\\\"\\n            android:exported=\\\"true\\\"\\n            android:screenOrientation=\\\"sensorLandscape\\\"\u003e\\n            \u003cintent-filter\u003e\\n                \u003caction android:name=\\\"android.intent.action.MAIN\\\" /\u003e\\n                \u003ccategory android:name=\\\"android.intent.category.LAUNCHER\\\" /\u003e\\n            \u003c/intent-filter\u003e\\n        \u003c/activity\u003e\\n    \u003c/application\u003e\\n\u003c/manifest\u003e\\n--- app/src/main/java/com/arenakahramanlari/game/MainActivity.java\\npackage com.arenakahramanlari.game;\\n\\nimport android.app.Activity;\\nimport android.graphics.Color;\\nimport android.os.Build;\\nimport android.os.Bundle;\\nimport android.view.View;\\nimport android.view.WindowInsets;\\nimport android.view.WindowInsetsController;\\nimport android.view.WindowManager;\\nimport android.webkit.WebChromeClient;\\nimport android.webkit.WebSettings;\\nimport android.webkit.WebView;\\nimport android.webkit.WebViewClient;\\n\\npublic class MainActivity extends Activity {\\n    private WebView gameView;\\n\\n    @Override\\n    protected void onCreate(Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\\n        hideSystemBars();\\n\\n        gameView = new WebView(this);\\n        gameView.setBackgroundColor(Color.rgb(29, 11, 51));\\n        gameView.setOverScrollMode(View.OVER_SCROLL_NEVER);\\n        gameView.setVerticalScrollBarEnabled(false);\\n        gameView.setHorizontalScrollBarEnabled(false);\\n\\n        WebSettings settings = gameView.getSettings();\\n        settings.setJavaScriptEnabled(true);\\n        settings.setDomStorageEnabled(true);\\n        settings.setDatabaseEnabled(true);\\n        settings.setAllowFileAccess(true);\\n        settings.setAllowContentAccess(true);\\n        settings.setMediaPlaybackRequiresUserGesture(false);\\n        settings.setSupportZoom(false);\\n        settings.setBuiltInZoomControls(false);\\n        settings.setDisplayZoomControls(false);\\n\\n        gameView.setWebViewClient(new WebViewClient());\\n        gameView.setWebChromeClient(new WebChromeClient());\\n        setContentView(gameView);\\n        gameView.loadUrl(\\\"file:///android_asset/index.html\\\");\\n    }\\n\\n    private void hideSystemBars() {\\n        if (Build.VERSION.SDK_INT \u003e= Build.VERSION_CODES.R) {\\n            WindowInsetsController controller = getWindow().getInsetsController();\\n            if (controller != null) {\\n                controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());\\n                controller.setSystemBarsBehavior(\\n                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\\n            }\\n        } else {\\n            getWindow().getDecorView().setS cript components to continue implementation in your app.\\\",\\\"scope\\\":\\\"GLOBAL\\\",\\\"status\\\":\\\"ENABLED\\\",\\\"installation_policy\\\":\\\"AVAILABLE\\\",\\\"installed\\\":false},{\\\"id\\\":\\\"plugin_connector_6912075cb358819187346bcafb601db8\\\",\\\"name\\\":\\\"fireflies\\\",\\\"display_name\\\":\\\"Fireflies\\\",\\\"description\\\":\\\"The Fireflies app brings your meetings and knowledge directly into ChatGPT.\\\\n\\\\nAnalyze any conversation—sales, customer success, product, recruiting—for insights, action items, and sentiment. Track feature requests and pain points, update CRMs or systems of record, and instantly retrieve context from your organization's meetings.\\\\n\\\\nWith Fireflies and ChatGPT, centralize your company knowledge and turn every conversation into searchable, actionable insights.\\\",\\\"scope\\\":\\\"GLOBAL\\\",\\\"status\\\":\\\"ENABLED\\\",\\\"installation_policy\\\":\\\"AVAILABLE\\\",\\\"installed\\\":false},{\\\"id\\\":\\\"plugins~Plugin_60aea7460bd4819199fd97a9553a5e12\\\",\\\"name\\\":\\\"superpowers\\\",\\\"display_name\\\":\\\"Superpowers\\\",\\\"description\\\":\\\"An agentic skills framework \u0026 software development methodology that works: planning, TDD, debugging, and collaboration workflows.\\\",\\\"scope\\\":\\\"GLOBAL\\\",\\\"status\\\":\\\"ENABLED\\\",\\\"installation_policy\\\":\\\"AVAILABLE\\\",\\\"installed\\\":false},{\\\"id\\\":\\\"plugin_asdk_app_6939e86417648191b7bda087d872685b\\\",\\\"name\\\":\\\"hugging-face\\\",\\\"display_name\\\":\\\"Hugging Face\\\",\\\"description\\\":\\\"Inspect models, datasets, Spaces, and research\\\",\\\"scope\\\":\\\"GLOBAL\\\",\\\"status\\\":\\\"ENABLED\\\",\\\"installation_policy\\\":\\\"AVAILABLE\\\",\\\"installed\\\":false},{\\\"id\\\":\\\"plugin_asdk_app_69a089a326dc8191b32a3f2553f5be2c\\\",\\\"name\\\":\\\"linear\\\",\\\"display_name\\\":\\\"Linear\\\",\\\"description\\\":\\\"Search, create and update Linear issues, projects, and initiatives. Draft PRDs, write upda
