<style>

@media(max-width:700px){#rot{display:none!important}#help{max-width:92vw!important;font-size:11px!important;top:4px!important;padding:5px 7px!important}#sup{right:16px;bottom:92px;width:58px;height:58px;font-size:25px}.col{top:58px;gap:6px}.col .b{width:76px;height:54px;font-size:10px}.col .b i{font-size:19px}#play{height:58px;font-size:27px;bottom:10px}#mode{height:58px;bottom:10px;font-size:12px}#mode small{font-size:10px}.card{width:130px}}
</style></head><body>

<div id="lobby">
 <div id="tl"><canvas id="av" width="60" height="60" style="background:#0006;border-radius:10px;border:3px solid #14162a"></canvas><div class="b" id="tr">🏆 0</div></div>

</div>

<script>
const $=s=>document.querySelector(s),cv=$('#g');let c=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let S={tr:0,coins:300,gems:10,sel:0,skin:0,own:[0],gift:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('ak3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ak3',JSON.stringify(S))}catch(e){}};
const BR=[
{n:'Şimşek',c:'#27b4f5',a:'#ffe14d',hp:2800,sp:3.1,dmg:520,cnt:1,spr:0,rng:330,rl:34,bs:13,k:2,ult:'Yıldırım Hattı',ud:'Nişan yönünde uzun bir yıldırım gönderir; yolundaki rakipleri vurur.',d:'Hızlı, uzun menzilli tek atış'},
{n:'Kor',c:'#ff6a2a',a:'#ffd23a',hp:3400,sp:2.7,dmg:300,cnt:5,spr:.55,rng:210,rl:48,bs:10,k:1,ult:'Alev Kasırgası',ud:'Çevresine alev dalgası yayar; yakındaki rakipleri yakar.',d:'Yakın mesafe saçma atışı'},
{n:'Kaya',c:'#3fb560',a:'#c9ff7a',hp:5200,sp:2.1,dmg:700,cnt:1,spr:0,rng:230,rl:58,bs:8,k:0,ult:'Deprem Yumruğu',ud:'Yakındaki rakiplere güçlü alan hasarı verir.',d:'Yavaş, çok dayanıklı tank'},
{n:'Gölge',c:'#8a4be0',a:'#ff6ad5',hp:3000,sp:2.9,dmg:340,cnt:3,spr:.4,rng:270,rl:40,bs:11,k:2,ult:'Sis Adımı',ud:'Kısa süre görünmez olur ve hızlanır.',d:'Üçlü yelpaze atışı'},
{n:'Pars',c:'#ee4f9a',a:'#fff',hp:2600,sp:3.3,dmg:170,cnt:1,spr:.05,rng:240,rl:13,bs:12,k:1,ult:'Pembe Fırtına',ud:'Nişan yönüne hızla atılır; yoluna çıkan rakiplere çarpar.',d:'Çok hızlı seri ateş'},
{n:'Bora',c:'#e8b020',a:'#2b2b2b',hp:2400,sp:2.8,dmg:760,cnt:1,spr:0,rng:430,rl:70,bs:16,k:0,ult:'Delici Mermi',ud:'Nişan yönünde çok güçlü, uzun menzilli bir mermi yollar.',d:'Keskin nişancı'},
{n:'Hayalet',c:'#17a89a',a:'#ffe14d',hp:2900,sp:3.3,dmg:330,cnt:3,spr:.35,rng:200,rl:34,bs:12,k:1,sk:1,ult:'Hayalet Formu',ud:'Kısa süre görünmez olur.',d:'Süperle görünmez olur, yakından vurur'},
{n:'Baykuş',c:'#6a4bbf',a:'#7dff6a',hp:2600,sp:3.2,dmg:240,cnt:3,spr:.3,rng:320,rl:36,bs:13,k:1,ps:1,ult:'Zehirli Yağmur',ud:'Etrafına zehirli hançerler fırlatır; isabet edenler zehirlenir.',d:'Zehirli hançerler fırlatır'},
{n:'Atılgan',c:'#2e5be6',a:'#ffd23a',hp:4200,sp:2.8,dmg:480,cnt:2,spr:.2,rng:190,rl:40,bs:10,k:0,sk:2,ult:'Roket Atılışı',ud:'Nişan yönünde ileri fırlar ve çarptığı rakiplere hasar verir.',d:'Süperle ileri atılıp çarptığı herkese vurur'},
{n:'Şifacı',c:'#f0a6c8',a:'#6fe3ff',hp:3300,sp:2.9,dmg:260,cnt:2,spr:.25,rng:280,rl:30,bs:12,k:2,sk:3,ult:'Şifa Patlaması',ud:'Eksik canının yarısını anında geri kazanır.',d:'Süperle canının yarısını yeniler'}];
const SK=[['Klasik',null,0],['Altın','#ffcf33',400],['Buz','#7ee8ff',400],['Gece','#b07cff',400]];
const BOTN=['Kaan','Mert','Zeynep','Efe','Deniz','Ada','Can','Yağız','Pelin'];
function shade(h,a){const n=parseInt(h.slice(1),16);const f=v=>clamp(v+a,0,255);return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
const acc=b=>SK[S.skin][1]||b.a;
function drawChar(x,y,r,b,ang,ac,hurt){
 c.save();c.translate(x,y);
 const ink='#17152b', skin='#ffd5a5';
 /* bold, toy-like silhouette with chunky boots and oversized head */
 c.fillStyle='rgba(0,0,0,.32)';c.beginPath();c.ellipse(0,r*.98,r*1.02,r*.34,0,0,Math.PI*2);c.fill();
 c.lineWidth=r*.13;c.lineJoin='round';c.lineCap='round';
 /* boots */
 c.fillStyle='#28263a';c.strokeStyle=ink;
 for(const s of [-1,1]){c.beginPath();c.ellipse(s*r*.39,r*.79,r*.31,r*.24,0,0,7);c.fill();c.stroke();
 c.fillStyle='#55516b';c.beginPath();c.ellipse(s*r*.39,r*.86,r*.28,r*.10,0,0,7);c.fill();c.stroke();}
 /* arms */
 c.fillStyle=hurt?'#fff':shade(b.c,-18);c.strokeStyle=ink;
 for(const s of [-1,1]){c.beginPath();c.ellipse(s*r*.78,r*.18,r*.27,r*.39,s*.18,0,7);c.fill();c.stroke();
 c.fillStyle=hurt?'#fff':ac;c.beginPath();c.arc(s*r*.91,r*.42,r*.2,0,7);c.fill();c.stroke();}
 /* weapon follows aim and has a bright muzzle */
 c.save();c.translate(r*.35,r*.08);c.rotate(ang);
 c.fillStyle='#24243a';c.strokeStyle=ink;c.lineWidth=r*.11;
 c.beginPath();c.roundRect(0,-r*.19,r*1.08,r*.38,r*.1);c.fill();c.stroke();
 c.fillStyle='#596078';c.fillRect(r*.18,-r*.12,r*.56,r*.10);
 c.fillStyle=ac;c.beginPath();c.roundRect(r*.88,-r*.24,r*.28,r*.48,r*.06);c.fill();c.stroke();
 c.fillStyle='#fff7b0';c.fillRect(r*1.02,-r*.12,r*.12,r*.24);
 c.restore();
 /* jacket / body */
 let g=c.createLinearGradient(-r,-r*.1,r,r);g.addColorStop(0,hurt?'#fff':shade(b.c,42));g.addColorStop(.55,hurt?'#fff':b.c);g.addColorStop(1,hurt?'#fff':shade(b.c,-48));
 c.fillStyle=g;c.strokeStyle=ink;c.lineWidth=r*.15;
 c.beginPath();c.moveTo(-r*.65,-r*.15);c.quadraticCurveTo(-r*.82,r*.05,-r*.72,r*.42);c.lineTo(-r*.58,r*.68);c.quadraticCurveTo(0,r*.83,r*.58,r*.68);c.lineTo(r*.72,r*.42);c.quadraticCurveTo(r*.82,r*.05,r*.65,-r*.15);c.closePath();c.fill();c.stroke();
 c.fillStyle=ac;c.beginPath();c.roundRect(-r*.52,r*.35,r*1.04,r*.19,r*.07);c.fill();c.stroke();
 /* big head */
 let h=c.createRadialGradient(-r*.24,-r*.83,r*.05,0,-r*.55,r*.88);h.addColorStop(0,'#fff0d7');h.addColorStop(.62,skin);h.addColorStop(1,'#c98560');
 c.fillStyle=hurt?'#fff':h;c.strokeStyle=ink;c.lineWidth=r*.13;
 c.beginPath();c.ellipse(0,-r*.55,r*.72,r*.72,0,0,7);c.fill();c.stroke();
 /* distinctive hair / helmet cap */
 c.fillStyle=hurt?'#fff':shade(b.c,-12);c.beginPath();c.moveTo(-r*.72,-r*.56);c.quadraticCurveTo(-r*.82,-r*1.23,-r*.25,-r*1.27);c.quadraticCurveTo(r*.35,-r*1.42,r*.69,-r*.85);c.lineTo(r*.69,-r*.56);c.quadraticCurveTo(0,-r*.84,-r*.72,-r*.56);c.closePath();c.fill();c.stroke();
 /* eyebrows and expressive eyes */
 c.strokeStyle=ink;c.lineWidth=r*.09;
 for(const s of [-1,1]){c.beginPath();c.moveTo(s*r*.13,-r*.76);c.lineTo(s*r*.39,-r*.79);c.stroke();}
 c.fillStyle='#fff';for(const s of [-1,1]){c.beginPath();c.ellipse(s*r*.27,-r*.48,r*.18,r*.22,0,0,7);c.fill();c.stroke();}
 c.fillStyle='#242039';for(const s of [-1,1]){c.beginPath();c.arc(s*r*.27+Math.cos(ang)*r*.045,-r*.47+Math.sin(ang)*r*.035,r*.095,0,7);c.fill();}
 /* cheek marks and grin */
 c.fillStyle='#ef8c82';for(const s of [-1,1]){c.beginPath();c.ellipse(s*r*.48,-r*.31,r*.10,r*.055,0,0,7);c.fill();}
 c.fillStyle='#6d2f38';c.strokeStyle=ink;c.lineWidth=r*.06;c.beginPath();c.moveTo(-r*.2,-r*.2);c.quadraticCurveTo(0,-r*.04,r*.22,-r*.2);c.quadraticCurveTo(0,r*.02,-r*.2,-r*.2);c.fill();c.stroke();
 /* glossy highlight */
 c.globalAlpha=.35;c.fillStyle='#fff';c.beginPath();c.ellipse(-r*.39,-r*.78,r*.13,r*.08,-.5,0,7);c.fill();c.globalAlpha=1;
 deco(b,r,ac);
 c.restore()
}
function tri(a,b,d,e,f,g,col){c.fillStyle=col;c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineTo(f,g);c.closePath();c.fill();c.stroke()}
function deco(b,r,ac){const n=b.n,H=-r*.55;
 if(n=='Şimşek'){for(const s of[-1,1])tri(s*r*.15,-r*1.2,s*r*.5,-r*1.9,s*r*.55,-r*1.1,ac);c.fillStyle=ac;c.beginPath();c.moveTo(r*.15,-r*.05);c.lineTo(-r*.3,r*.3);c.lineTo(0,r*.3);c.lineTo(-r*.2,r*.8);c.lineTo(r*.35,r*.2);c.lineTo(r*.05,r*.2);c.closePath();c.fill();c.stroke()}
 else if(n=='Kor'){tri(-r*.5,-r*1.1,-r*.4,-r*1.9,-r*.05,-r*1.2,'#ff4a1a');tri(-r*.25,-r*1.15,0,-r*2.2,r*.3,-r*1.15,'#ffd23a');tri(r*.1,-r*1.1,r*.55,-r*1.8,r*.6,-r*1.05,'#ff4a1a')}
 else if(n=='Kaya'){for(const s of[-1,1]){c.fillStyle='#98a79b';c.beginPath();c.arc(s*r*.9,0,r*.4,0,7);c.fill();c.stroke()}c.fillStyle='#98a79b';c.fillRect(-r*.7,-r*.95,r*1.4,r*.22);c.strokeRect(-r*.7,-r*.95,r*1.4,r*.22)}
 else if(n=='Gölge'){tri(-r*.7,-r*1.0,-r*1.6,-r*.6,-r*.7,-r*.7,ac);c.fillStyle='#2a1550';c.beginPath();c.arc(0,H,r*.7,0,Math.PI);c.closePath();c.fill();c.stroke()}
 else if(n=='Pars'){tri(-r*.7,-r*1.0,-r*.55,-r*1.8,-r*.1,-r*1.2,b.c);tri(r*.7,-r*1.0,r*.55,-r*1.8,r*.1,-r*1.2,b.c);tri(-r*.5,-r*1.15,-r*.5,-r*1.5,-r*.3,-r*1.2,ac);tri(r*.5,-r*1.15,r*.5,-r*1.5,r*.3,-r*1.2,ac);c.beginPath();for(const s of[-1,1]){c.moveTo(s*r*.4,-r*.3);c.lineTo(s*r*1.0,-r*.4);c.moveTo(s*r*.4,-r*.2);c.lineTo(s*r*1.0,-r*.15)}c.stroke()}
 else if(n=='Bora'){c.fillStyle='#9c6428';c.beginPath();c.roundRect(-r*.5,-r*1.7,r,r*.7,r*.2);c.fill();c.stroke();c.fillStyle='#7a4b1a';c.beginPath();c.ellipse(0,-r*1.0,r*1.15,r*.26,0,0,7);c.fill();c.stroke();c.fillStyle=ac;c.fillRect(-r*.5,-r*1.2,r,r*.13)}
 else if(n=='Hayalet'){tri(-r*.75,-r*.9,0,-r*2.2,r*.75,-r*.9,shade(b.c,-25));c.fillStyle='#0d3d38';c.beginPath();c.arc(0,H,r*.7,0,Math.PI);c.closePath();c.fill();c.stroke()}
 else if(n=='Baykuş'){tri(-r*.6,-r*1.05,-r*.7,-r*1.7,-r*.2,-r*1.2,b.c);tri(r*.6,-r*1.05,r*.7,-r*1.7,r*.2,-r*1.2,b.c);for(const s of[-1,1]){c.fillStyle=shade(b.c,-30);c.beginPath();c.ellipse(s*r*.9,r*.35,r*.28,r*.5,0,0,7);c.fill();c.stroke();c.fillStyle=ac;c.beginPath();c.arc(s*r*.27,-r*.45,r*.3,0,7);c.fill();c.stroke()}tri(-r*.13,-r*.3,r*.13,-r*.3,0,0,'#ffb02e')}
 else if(n=='Atılgan'){for(const s of[-1,1]){c.fillStyle='#f4f4f4';c.beginPath();c.moveTo(s*r*.6,-r*.9);c.quadraticCurveTo(s*r*1.5,-r*.9,s*r*1.3,-r*1.8);c.quadraticCurveTo(s*r*1.1,-r*1.1,s*r*.45,-r*.7);c.closePath();c.fill();c.stroke()}c.fillStyle='#9aa3b5';c.beginPath();c.arc(0,-r*.6,r*.72,Math.PI,0);c.closePath();c.fill();c.stroke();c.fillStyle='#c4682a';c.beginPath();c.arc(0,H+r*.1,r*.62,.15,Math.PI-.15);c.closePath();c.fill();c.stroke()}
 else if(n=='Şifacı'){c.strokeStyle='#ffd23a';c.lineWidth=r*.12;c.beginPath();c.ellipse(0,-r*1.55,r*.5,r*.15,0,0,7);c.stroke();c.strokeStyle='#150a24';c.lineWidth=r*.14;for(const s of[-1,1]){c.fillStyle=b.c;c.beginPath();c.arc(s*r*.85,-r*.5,r*.25,0,7);c.fill();c.stroke()}c.fillStyle='#fff';c.fillRect(-r*.12,0,r*.24,r*.55);c.fillRect(-r*.3,r*.15,r*.6,r*.24)}}
/* ---- LOBBY ---- */
const $m=$('#md'),$b=$('#mb');
function M(h){$b.innerHTML=h+'<p><button class="b" onclick="$m.style.display=\'none\'">Kapat</button></p>';$m.style.display='flex'}
function shop(){let h='<h2>DÜKKAN</h2><p>🪙 '+S.coins+'</p><div class="row">';SK.forEach((s,i)=>{const o=S.own.includes(i);h+=`<div class="card ${S.skin==i?'on':''}"><div class="sw" style="background:${s[1]||'#fff'}"></div><b>${s[0]}</b><small>Aksesuar rengi</small><button class="b" onclick="buy(${i})">${S.skin==i?'Seçili':o?'Kullan':'🪙 '+s[2]}</button></div>`});M(h+'</div>')}
function buy(i){if(S.own.includes(i)||S.coins>=SK[i][2]){if(!S.own.includes(i)){S.coins-=SK[i][2];S.own.push(i)}S.skin=i;save();hud();shop()}else alert('Yeterli altın yok')}
